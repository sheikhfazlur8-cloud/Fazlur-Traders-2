on:
  push:
    paths:
      - '*.zip'
  workflow_dispatch:

jobs:
  unzip:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Unzip and Clean
        run: |
          for f in *.zip; do
            [ -e "$f" ] || continue
            echo "Unzipping $f..."
            unzip -o "$f"
            rm "$f"
          done

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Auto extracted zip files" || exit 0
          git push
